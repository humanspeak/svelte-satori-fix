name: Run tests

permissions:
    contents: read

on:
    workflow_call:
    pull_request:
        branches:
            - main
            - '!dependabot/**'
        paths:
            - src/**
            - tests/**
            - '!docs/**'
            - package.json
            - package-lock.json
            - svelte.config.*
            - vite.config.*
            - playwright.config.*
            - tsconfig*.json
            - .github/workflows/run-tests.yml

concurrency:
    group: run-tests-${{ github.ref }}
    cancel-in-progress: true

jobs:
    unit-tests:
        runs-on: ubuntu-latest
        timeout-minutes: 10
        steps:
            - name: Checkout
              uses: actions/checkout@v6 # zizmor: ignore[unpinned-uses]
              with:
                  persist-credentials: false
                  fetch-depth: 1

            - uses: pnpm/action-setup@v4 # zizmor: ignore[unpinned-uses]
              with:
                  version: 10

            - name: Use Node.js - 24
              uses: actions/setup-node@v6 # zizmor: ignore[unpinned-uses]
              with:
                  node-version: 24

            - name: Cache build artifacts
              uses: actions/cache@v5 # zizmor: ignore[unpinned-uses]
              with:
                  path: |
                      .svelte-kit
                      dist
                  key: ${{ runner.os }}-build-${{ hashFiles('src/**/*', 'pnpm-lock.yaml') }}
                  restore-keys: |
                      ${{ runner.os }}-build-

            - name: Cache vitest artifacts
              uses: actions/cache@v5 # zizmor: ignore[unpinned-uses]
              with:
                  path: |
                      node_modules/.vitest
                      test-results
                  key: ${{ runner.os }}-vitest-${{ hashFiles('pnpm-lock.yaml', 'src/**/*.{test,spec}.{js,ts}', 'tests/**/*.{test,spec}.{js,ts}', 'vitest.config.ts') }}
                  restore-keys: |
                      ${{ runner.os }}-vitest-

            - name: Install dependencies
              run: pnpm install --frozen-lockfile

            - name: Run unit tests
              run: pnpm test

            - name: Upload unit test results
              if: always()
              uses: actions/upload-artifact@v4 # zizmor: ignore[unpinned-uses]
              with:
                  name: unit-test-results
                  path: |
                      coverage/**
                      test-results/**
                  if-no-files-found: ignore
                  retention-days: 7
